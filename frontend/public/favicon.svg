<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Document Gradient -->
    <linearGradient id="docGrad" x1="8" y1="4" x2="28" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Lens Ring Gradient -->
    <linearGradient id="lensRingGrad" x1="18" y1="14" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Lens Glass Radial Glow -->
    <radialGradient id="lensGlassGlow" cx="28" cy="25" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.85" />
    </radialGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="35" y1="33" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="lensGlow" x="12" y="10" width="36" height="36" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Resume Document Silhouette -->
  <path
    d="M8 8C8 5.79086 9.79086 4 12 4H24L32 12V38C32 40.2091 30.2091 42 28 42H12C9.79086 42 8 40.2091 8 38V8Z"
    fill="url(#docGrad)"
    stroke="rgba(99, 102, 241, 0.4)"
    stroke-width="1.75"
  />

  <!-- Document Folded Corner -->
  <path
    d="M24 4V10C24 11.1046 24.8954 12 26 12H32"
    stroke="rgba(99, 102, 241, 0.5)"
    stroke-width="1.75"
    fill="#131D33"
  />

  <!-- Resume Content Scan Lines -->
  <line x1="13" y1="14" x2="20" y2="14" stroke="#94A3B8" stroke-width="1.75" stroke-linecap="round" opacity="0.6" />
  <line x1="13" y1="19" x2="22" y2="19" stroke="#94A3B8" stroke-width="1.75" stroke-linecap="round" opacity="0.6" />
  <line x1="13" y1="24" x2="19" y2="24" stroke="#94A3B8" stroke-width="1.75" stroke-linecap="round" opacity="0.6" />
  <line x1="13" y1="29" x2="17" y2="29" stroke="#94A3B8" stroke-width="1.75" stroke-linecap="round" opacity="0.6" />

  <!-- Lens Glass Body -->
  <circle
    cx="28"
    cy="25"
    r="11"
    fill="url(#lensGlassGlow)"
    stroke="url(#lensRingGrad)"
    stroke-width="2.25"
    filter="url(#lensGlow)"
  />

  <!-- Optical Iris / Focus Target Inside Lens -->
  <circle cx="28" cy="25" r="3" fill="#38BDF8" opacity="0.9" />
  <circle cx="28" cy="25" r="6" stroke="#818CF8" stroke-width="1" stroke-dasharray="2 2" opacity="0.75" />

  <!-- Glare Arc Highlight -->
  <path
    d="M22 20C23.8 17.5 27 16.5 30 17.5"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- Lens Handle -->
  <path
    d="M36 33L43 40"
    stroke="url(#handleGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
</svg>
